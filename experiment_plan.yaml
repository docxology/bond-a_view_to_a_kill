# experiment_plan.yaml — a_view_to_a_kill (ZORIN)
# Declares the deterministic mission conditions for evidence validation.

mission:
  film: "a_view_to_a_kill"
  codename: "ZORIN"
  seed: 1985

conditions:
  supply_chain:
    graph: "default 12-firm / 18-link reconstruction"
    acquired_firms: ["amd_fab", "nec_fab"]
    primary_metric: "market-wide HHI (pre => post-elimination)"
    ablation: "acquire 0, 1, 2 fabricators; observe HHI and ZORIN fab share"
  mine_flood:
    network: "Main Strike, 8 chambers / 10 tunnels, 9100 m^3"
    ingress: 10.0  # m^3/s
    horizon: 900.0  # s
    dt: 1.0
    primary_metric: "flooded_fraction at horizon; water_balance_error ~ 0"
    ablation: "single-entry candidates (adit / shaft_a / shaft_b); critical_ingress argmax"
  race_cover:
    records: "20 (5 horses x 4 races)"
    halflife: 2.0
    boost: 0.2
    natural_sigma: 0.5
    primary_metric: "cover_viability expected_value (win_delta vs detection_risk)"
    ablation: "boost sweep 0.0..3.0; expected value peaks at moderate boost"
  acquisition:
    budget: 2
    acquireable: ["amd_fab", "intel_fab", "nec_fab"]
    primary_metric: "optimal post-elimination HHI vs baseline; greedy regret"
    ablation: "budget sweep 0..3; exhaustive vs greedy"
  valley:
    fabs: 5
    coupling: "leakage x chamber head vs foundation elevation"
    primary_metric: "valley_capacity_loss at horizon; victims/survivors"
    ablation: "ingress entries (adit / adit+shaft_a); capacity loss over time"
  market:
    overround: 1.12
    bankroll: 100000.0
    primary_metric: "cover_bankroll value edge, Kelly stake, expected profit"
    ablation: "overround sweep; boost sweep; true vs market-implied gap"

expected_figures:
  - "output/figures/choke_points.png"
  - "output/figures/flood_curve.png"
  - "output/figures/race_cover.png"
  - "output/figures/acquisition_curve.png"
  - "output/figures/valley_impact.png"

expected_tables:
  - "results tables in manuscript 03_results.md (HHI, flood, acquisition, valley, market)"

baseline: "deterministic mission metrics recomputed on every z_generate run"
