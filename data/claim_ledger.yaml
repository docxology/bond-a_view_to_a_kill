# Claim ledger — a_view_to_a_kill (ZORIN)
# Registers sourced numeric claims and their provenance. The datasets in the
# pure core are MODEL PARAMETERS (documented, fixed, deterministic), not
# measured field data; their role is to make the mathematics reproducible
# and testable.

model_datasets:
  - id: supply_chain
    value: "12 firms, 18 links, 4 stages"
    source: "chip_supply_chain.build_default_supply_chain()"
    role: "reconstructed mid-1980s semiconductor market; capacities are model parameters"
  - id: mine_network
    value: "8 chambers, 10 tunnels, 9100 m^3 total"
    source: "mine_flood.build_default_mine()"
    role: "fictionalized gallery geometry (Main Strike)"
  - id: race_card
    value: "5 horses x 4 races = 20 records"
    source: "race_analytics.FORM_TABLE"
    role: "reconstructed Epsom-style card; race times are model parameters"

computed_metrics:
  - id: market_hhi
    value: "892.2 / 1528.9 (pre / post-elimination)"
    generator: "chip_supply_chain.hhi, post_elimination_hhi"
  - id: zorin_fab_share
    value: "0.680 (2 fabs acquired)"
    generator: "chip_supply_chain.monopoly_share"
  - id: top_choke_point
    value: "amkor (betweenness)"
    generator: "chip_supply_chain.top_choke_points"
  - id: flood_fraction
    value: "0.625 at horizon (Q=10, T=900)"
    generator: "mine_flood.flooded_fraction"
  - id: water_balance_error
    value: "~1e-15"
    generator: "mine_flood.water_balance_error"
  - id: cover_metrics
    value: "win_delta 0.035 / detection_risk 0.001 / expected_value 2924 (boost 0.2)"
    generator: "race_analytics.cover_viability"

film_facts:
  - id: film_reference
    value: "A View to a Kill (1985). ZORIN plans to monopolize the microchip market by flooding the mine under Silicon Valley; a racehorse provides cover."
    source: "the film (Eon Productions)"
