# a_view_to_a_kill — PROJECT BOND film package (A View to a Kill, 1985)
# Mission codename ZORIN. Loaded by src/a_view_to_a_kill/manuscript_variables.py
# (experiment parameters + identity tokens). Local-only tree — no DOIs, no
# remote publishing metadata. Never hand-author metrics in prose: they flow
# through manuscript_variables.py from the pure domain core.

paper:
  title: "A View to a Kill: ZORIN — Special-Agent Mission Software"
  subtitle: "Six Deterministic Models of the ZORIN Scheme: Supply-Chain Choke Points, Budgeted Monopoly Acquisition, Flood-The-Mine Water Ingress, Valley Capacity Loss, Race-Form Cover Risk, and Cover Finance"
  version: "0.1.0"
  date: "2026-08-04"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

keywords:
  - "microchip supply-chain security"
  - "monopoly choke points"
  - "herfindahl-hirschman index"
  - "betweenness centrality"
  - "budgeted acquisition optimization"
  - "water-ingress dynamics"
  - "mine flooding simulation"
  - "groundwater inundation damage"
  - "horse-race form analytics"
  - "cover-operation modeling"
  - "signal-detection theory"
  - "kelly criterion"
  - "betting-market pricing"
  - "reproducible research"
  - "deterministic simulation"

metadata:
  license: "MIT"
  language: "en"
  mission_codename: "ZORIN"

# Deterministic mission experiment parameters. These are turned into a
# metrics.MissionScenario by metrics.scenario_from_config() and threaded into
# the pure models, so changing a knob here changes the *computed* tokens, not
# just the CONFIG_* echo of this file. tests/test_metrics_scenario.py pins
# every knob to a computed metric it must move, so an inert knob fails the
# suite.
experiment:
  # Microchip supply graph is fixed in src/a_view_to_a_kill/chip_supply_chain.py.
  # Flood scenario: total ingress rate (m^3/s) into the entry chambers, and
  # simulation horizon (s).
  flood_ingress_rate: 10.0
  flood_horizon: 900.0
  # Race-form EWMA halflife (races); cover-operation boost (speed index) and
  # the horse's natural race-to-race variability (speed-index units).
  race_halflife: 2.0
  cover_boost: 0.2
  cover_sigma: 0.5
  # Monopoly acquisition budget (number of independent fabricators to buy);
  # the cover-operation betting bankroll (USD); the bookmaker's overround
  # (weighted margin applied when pricing the race).
  acquisition_budget: 2
  cover_bankroll: 100000.0
  market_overround: 1.12
  # The firms the film-faithful ZORIN scenario actually acquires. This is a
  # *scenario* choice, not the optimizer's answer — the manuscript reconciles
  # the two explicitly (see 03_results "Scenario versus optimizer").
  scenario_acquired_firms: ["amd_fab", "nec_fab"]

testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0
