# domain_profile.yaml — a_view_to_a_kill (ZORIN)
# Declarative advisory controls for an agentic research workflow. Validation
# inputs only; they do not execute autonomous agents.

domain: "deterministic mission modeling (selected: microchip supply-chain security, mine-flood water ingress, race-form cover analytics)"

review_gates:
  - coverage_fail_under: 90
    command: "uv run pytest tests/ --cov=src --cov-fail-under=90 -q"
  - ruff: "uv run ruff check src/ scripts/ tests/"
  - mypy: "uv run mypy src/ scripts/"
  - lineage: "rg template[_]code_project (expect zero in src, manuscript, docs)"
  - no_mocks: "grep for unittest.mock / MagicMock / @patch in tests/ (expect zero)"
  - determinism: "two run_mission calls produce byte-identical reports"

source_policy:
  model_data: "documented fixed parameters in the pure core; no external fetch at runtime"

artifact_expectations:
  - "manuscript tokens computed from manuscript_variables.py (never authored)"
  - "output/figures/*.png regenerated deterministically"
  - "mission outcomes carry Provenance (seed 1985, input_hash)"

benchmark_rubric_preferences:
  - "prefer closed-form analytic expectations over loose bounds"
  - "assert mass conservation to machine precision"
  - "keep every numeric claim traceable to a generator function"
